# Render Blueprint: the portfolio as a static site built by Vite.
# In Render: New > Blueprint, pick this repository, and it reads this file.
services:
  - type: web
    name: samraddh-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      # file names under /assets carry a content hash, so they can be cached forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
