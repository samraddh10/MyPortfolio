<!-- Decides before the first paint whether to show the welcome screen: once per visit, and never
     when the link points at a section. If the app hasn't started after 5 s, any click or key lets you in. -->
<script>(function(){var d=document.documentElement;try{var h=location.hash;if(sessionStorage.getItem('portfolio-entered')||(h&&h!=='#top'))return;}catch(e){}d.classList.add('gated');setTimeout(function(){if(window.__gateReady)return;var go=function(){d.classList.remove('gated');};addEventListener('click',go,{once:true});addEventListener('keydown',go,{once:true});},5000);})();</script>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
